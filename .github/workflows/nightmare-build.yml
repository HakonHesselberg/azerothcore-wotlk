name: Nightmare Northshire build

on:
  push:
    branches:
      - nightmare-kobolds
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: nightmare-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-build
        with:
          CC: clang-18
          CXX: clang++-18
          pch: false
          maxerrors: 5
